<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clément Lequeurre - Site en reconstruction</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0b08;
    --bg-glow: #2a1f10;
    --text: #f6f1e7;
    --muted: #a89f8f;
    --accent: #ffcb05;
    --accent-2: #ff7a1a;
    --card: #17130d;
    --border: #332a1a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 24px;
  }

  .hazard-bar {
    position: fixed;
    left: 0;
    right: 0;
    height: 14px;
    background: repeating-linear-gradient(45deg, #0d0b08 0 14px, var(--accent) 14px 28px);
    z-index: 10;
  }

  .hazard-bar.top { top: 0; }
  .hazard-bar.bottom { bottom: 0; }

  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
  }

  .worker-scene {
    width: 180px;
    margin: 0 auto 16px;
  }

  .worker-scene svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .worker {
    animation: bob 1.1s ease-in-out infinite;
  }

  .hammer-arm {
    animation: swing 1.1s ease-in-out infinite;
    transform-origin: 93px 70px;
  }

  @keyframes bob {
    0%, 45%  { transform: translateY(0); }
    55%      { transform: translateY(2px); }
    100%     { transform: translateY(0); }
  }

  @keyframes swing {
    0%   { transform: rotate(-150deg); }
    40%  { transform: rotate(-170deg); }
    55%  { transform: rotate(5deg); }
    100% { transform: rotate(-150deg); }
  }

  .dust circle {
    fill: var(--accent);
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 1.1s ease-out infinite;
  }

  .dust circle:nth-child(2) { animation-delay: 0.03s; }
  .dust circle:nth-child(3) { animation-delay: 0.06s; }

  @keyframes puff {
    0%, 50% { opacity: 0; transform: scale(0.3); }
    58%     { opacity: 0.7; transform: scale(1); }
    75%     { opacity: 0; transform: scale(1.7); }
    100%    { opacity: 0; }
  }

  .status-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border: 2px dashed var(--accent);
    border-radius: 4px;
    background: rgba(255, 203, 5, 0.08);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 28px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    text-transform: uppercase;
    font-size: clamp(34px, 6vw, 48px);
    line-height: 1.1;
    margin: 0 0 16px;
    letter-spacing: 0.01em;
  }

  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.lead {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    background: #241c10;
    transform: translateY(-2px);
  }

  .links svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  footer {
    margin-top: 48px;
    color: #6b6152;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="hazard-bar top"></div>
  <div class="hazard-bar bottom"></div>

  <main class="card">

    <div class="worker-scene">

          <g class="hammer-arm">

            <g transform="translate(93,104)">

              <rect x="-16" y="-7" width="32" height="14" rx="3" fill="#9aa3b3"/>

          </g>

    </div>
    <p class="status-label">⚠ En reconstruction</p>

    <footer>&copy; 2026 Clément Lequeurre</footer>
  </main>
</body>
</html>
