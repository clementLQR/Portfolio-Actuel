<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio de Clément Lequeurre, développeur web et creative developer en BUT MMI. Projets, compétences et parcours. Recherche un stage de mars à juin 2027." />
    <title>Clément Lequeurre | Portfolio développeur web</title>
    <link rel="canonical" href="https://clementlequeurre.com/" />
    <meta name="theme-color" content="#0b0f14" />

    <!-- Aperçu de partage (LinkedIn, Discord, messageries, réseaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clément Lequeurre" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://clementlequeurre.com/" />
    <meta property="og:title" content="Clément Lequeurre | Portfolio développeur web" />
    <meta property="og:description" content="Développeur web et creative developer en BUT MMI. Projets, compétences et parcours, guidés par une mascotte 3D. Recherche un stage de mars à juin 2027." />
    <meta property="og:image" content="https://clementlequeurre.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clément Lequeurre, développeur web et creative dev, à côté de la mascotte 3D de son portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clément Lequeurre | Portfolio développeur web" />
    <meta name="twitter:description" content="Développeur web et creative developer en BUT MMI. Recherche un stage de mars à juin 2027." />
    <meta name="twitter:image" content="https://clementlequeurre.com/og-image.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Données structurées : qui est l'auteur du site (moteurs de recherche) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Clément Lequeurre",
        "url": "https://clementlequeurre.com/",
        "image": "https://clementlequeurre.com/og-image.jpg",
        "jobTitle": "Développeur web",
        "email": "mailto:clement.lequeurre@gmail.com",
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "IUT de Blois" },
        "sameAs": ["https://www.linkedin.com/in/cl%C3%A9ment-lequeurre", "https://github.com/clementLQR"]
      }
    </script>
    <!-- Polices hébergées sur le site : les deux les plus visibles sont préchargées -->
    <link rel="preload" href="/fonts/montserrat-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/chakra-petch-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Thème appliqué avant le premier rendu : pas de flash -->
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("hub-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="grain">
    <div id="root"></div>
    <noscript>Ce portfolio a besoin de JavaScript pour s'afficher.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
